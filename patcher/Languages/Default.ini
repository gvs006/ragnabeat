[Language]
// Mensagens do Thor Patcher, em PT-BR.
//
// POR QUE ISTO E O Default.ini, E NAO UM Portugues.ini
// O Thor escolhe o arquivo pelo LCID do Windows, via LanguageMap.ini - o
// pt-BR seria lid1046. Mas o tester que roda Windows em ingles cairia no
// Default.ini e veria o patcher em ingles. Como TODO mundo aqui fala
// portugues, o portugues e que e o padrao; mapa de idioma nao resolve nada
// e so cria um segundo lugar para esquecer de atualizar.
//
// As marcadas com * levam substituicao: %s e texto, %u e numero. Um "%"
// literal precisa ser escrito "%%".

getting_info='Falando com o servidor de atualizacao...'

update_patcher='Atualizando o patcher...'

update_client='Atualizando o cliente...'

repacking='Reempacotando os arquivos...'

saving_res='Salvando...'

//*
getting_file='Baixando %s.'

//*
need_defrag='Os dados estao %u%% fragmentados. Quer desfragmentar agora?'

defraging='Desfragmentando...'

confirmation='Aguardando confirmacao...'

client_locked='O jogo ja esta aberto.'

failed_to_communicate='Nao consegui falar com o servidor. O Tailscale esta ligado?'

//*
failed_to_get='Nao consegui baixar %s'

update_failed='A atualizacao falhou'

connecting='Conectando...'

