//Configuracao REMOTA do Thor Patcher do RagnaBeat.
//
//Este arquivo fica no servidor, nao no PC do jogador. E o unico jeito de
//mudar o comportamento do patcher de quem ja baixou - o config.ini local so
//muda com cliente novo.

[Main]
//Deixar false fecha o patch para todo mundo (manutencao).
allow=true

//Pular a tela e ir direto para o jogo.
Force_Start=false

//Aparece quando allow=false.
policy_msg=O Midgard Eternal esta em manutencao. Tente de novo em alguns minutos.

//file_url - de onde vem os .thor. OBRIGATORIO e ABSOLUTO.
//
//Ja tentei deixar vazio, para o endereco viver so no config.ini local. Nao
//funciona: o patcher le este arquivo, nao acha para onde ir e para ali mesmo,
//sem nunca buscar o plist.txt - a tela fica em "CANCELAR" para sempre, sem
//mensagem de erro. O RootURL do config.ini NAO serve de padrao para isto.
//
//Entao o IP aparece aqui tambem. A diferenca e que este arquivo mora no
//servidor: trocar aqui vale para todo mundo na hora, enquanto o config.ini
//tem que ser trocado na maquina de cada tester.
file_url=http://100.76.66.99:8099/data/

[Patch]
//Hash do cliente e do patcher, do CheckSum.exe. Vazios = atualizacao
//automatica de exe desligada.
//
//Ligar isso exige gerar o hash A CADA build novo do cliente, senao todo mundo
//trava numa atualizacao que nao existe. Fica desligado ate a distribuicao
//estabilizar.
ClientSum=
PatcherSum=

ClientPath=
PatcherPath=

PatchList=plist.txt

[Stars]
//Botoes extras de "jogar" com exe alternativo. Nao usamos: o RagnaBeat2.exe e
//o 3 sao abertos direto pela pasta.
clients=0

[Misc]
//Acima deste nivel de fragmentacao o patcher sugere desfragmentar.
FragmentLimit=50
