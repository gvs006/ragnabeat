###########################################################################
# Barter Database
###########################################################################
#
#  - Name               NPC name.
#    Map / X / Y        Sem estes campos a loja fica flutuando (e o caso aqui).
#    Items:             Lista do que se vende.
#      - Index          Posicao na janela (0-...).
#        Item           AegisName.
#        Stock          0 = ilimitado (padrao).
#        RequiredItems: O que o jogador paga.
###########################################################################

# ------------------------------------------------------------------------
# RAGNABEAT - Mercado Negro (Contrabandista, npc/custom/black_market.txt)
#
# Uma loja por (parte do corpo x tipo). Nenhuma tem "Map": ficam flutuando e
# so abrem pelo callshop do Contrabandista, que e o unico NPC visivel.
#
# O nome segue Contra#<tipo>_<slot>, e o script monta esse nome a partir do
# menu. Loja que nao existe aqui simplesmente nao aparece no menu de la - a
# mascara .Tipos[] do OnInit e quem diz o que existe. Mexeu aqui, mexa la.
#
#   mvp   Cartas MvP      cartas de MVP e raras           100 moedas
#   norm  Cartas Normais  as mais usadas no dia a dia      10 moedas
#   eq    Equips          equipamento nativo de pre-re     30 moedas
#   3rd   Equips 3rd      trazido do renewal               50 moedas
#                         (definido em db/ragnabeat_items.yml)
#
# Moeda: Mithril_Coin (674), com peso zerado em db/ragnabeat_items.yml.
#
# Agrupado pelo slot REAL de cada item (campo Locations do db/pre-re), nao
# por chute. Confira la antes de mover alguma coisa de lugar.
#
# ATENCAO - BONUS ALEATORIO: barter entrega o item CRU. Ele nao passa pelo
# randopt_drop_* nem pelo randomoptgroup(), entao nada comprado aqui vem com
# BA. Ver docs/rebalance.md.
#
# Sem Zeny, sem Refine e com um unico item exigido, o rAthena trata como
# barter simples (nao "extended") - o que o cliente 2025 abre nativamente com
# icone, descricao e escolha de quantidade.
# ------------------------------------------------------------------------

