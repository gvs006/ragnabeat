# ---------------------------------------------------------------------------
# RESISTENCIA E DANO POR RACA, E CHEFE - acrescentados em 03/set/2026
# ---------------------------------------------------------------------------
# OS Ids NAO SAO ESCOLHA NOSSA. Eles tem de bater com o EnumVAR do cliente,
# que e quem decide o TEXTO mostrado na linha do item. Id 101 e
# "Dano fisico contra Inseto" porque e assim no kRO; inventar outro numero
# faria o servidor aplicar o bonus certo e o cliente escrever outra coisa.
# Copiados de db/re/item_randomopt_db.yml, que e o mapa oficial - aquele
# arquivo esta no Footer do db/item_randomopt_db.yml mas NAO carrega neste
# build (as entradas dele sao Mode: Renewal), por isso a copia.
#
# ESTAR DEFINIDO AQUI NAO POE NADA EM JOGO. Opcao so aparece se algum grupo
# do item_randomopt_group.yml sortear ela. As 22 abaixo estao definidas para
# que acrescentar qualquer uma ao grupo seja uma linha - hoje so duas estao
# em uso (RACE_DAMAGE_INSECT e CLASS_DAMAGE_BOSS_TARGET, no T3).
#
# CUIDADO AO MEXER NO TAMANHO DO POOL: o sorteio extra pega UMA opcao da
# lista ao acaso (itemdb.cpp:4695). Cada opcao nova dilui todas as outras.
# Por isso as 22 nao foram jogadas todas no grupo de uma vez - o pool do T3
# passaria de 14 para 36 e cada bonus ficaria 2,6x mais raro, desfazendo o
# aumento de chance feito no mesmo dia.
# ---------------------------------------------------------------------------
  - Id: 87
