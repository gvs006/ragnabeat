###########################################################################
# Item Random Option Database — Ragnabeat (pre-renewal)
###########################################################################
#
# O db/item_randomopt_db.yml da raiz importa db/re/... apenas com "Mode: Renewal",
# que e ignorado no build PRERE. Este arquivo e importado SEM condicao, entao e
# aqui que as opcoes do servidor sao definidas.
#
# IMPORTANTE: os Ids abaixo sao os OFICIAIS. O client traduz o Id para o texto
# da descricao usando enumvar.lub — mudar um Id faz a linha aparecer errada ou
# em branco. Adicione opcoes novas a partir do Id 100 para nao colidir.
#
# O campo "Option" e um nome livre (o parser nao valida contra constante alguma);
# ele so serve de rotulo para referenciar a opcao em item_randomopt_group.yml.
#
# getrandomoptinfo(ROA_VALUE) devolve o valor sorteado entre MinValue e MaxValue
# definidos no grupo.
#
###########################################################################

Header:
  Type: RANDOM_OPTION_DB
  Version: 1

Body:
