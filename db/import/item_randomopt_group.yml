###########################################################################
# Item Random Option Group Database — Ragnabeat (pre-renewal)
###########################################################################
#
# Tres tiers, escolhidos automaticamente pelo nivel de uso do equipamento
# dropado (ver conf/import/battle_conf.txt -> randopt_drop_*).
#
#   Id 1  RAGNABEAT_T1  equip comum      1 a 2 bonus
#   Id 2  RAGNABEAT_T2  equip intermed.  1 a 3 bonus
#   Id 3  RAGNABEAT_T3  equip alto/MVP   2 a 4 bonus
#
# ---------------------------------------------------------------------------
# ARMADILHA DO PARSER — leia antes de mexer em MaxRandom
# ---------------------------------------------------------------------------
# O cabecalho do arquivo oficial diz que MaxRandom e uma *quantidade* limitada
# a (5 - total de Slots). O CODIGO NAO FAZ ISSO.
#
# s_random_opt_group::apply() percorre os INDICES 0 .. MaxRandom-1 e pula os ja
# ocupados pelos Slots garantidos. O parser so limita MaxRandom a
# MAX_ITEM_RDM_OPT (5), sem descontar os Slots.
#
# Ou seja: MaxRandom e um TETO DE INDICE, nao uma contagem.
#   total possivel = max(nº de Slots, MaxRandom)
#
#   1 Slot + MaxRandom 2 -> 1 a 2 bonus
#   1 Slot + MaxRandom 4 -> 1 a 4 bonus
#   2 Slots + MaxRandom 4 -> 2 a 4 bonus
#
# O teto absoluto e 5 e vem do PROTOCOLO: o pacote de item carrega
# { <option id>.W <option value>.W <option param>.B }*5 fixo. Nao da para
# passar de 5 sem alterar o client.
# ---------------------------------------------------------------------------
#
# Slots  = garantidos. Sai sempre um, mesmo que a rolagem de Chance falhe
#          (apply() tem fallback que aplica uma opcao a forca).
#          Com Chance 10000 em todas, o sorteio vira uniforme na lista.
# Random = extras. Cada slot sorteia UMA opcao da lista e rola a Chance dela;
#          se falhar, o slot fica vazio. A Chance media da lista e, na pratica,
#          a taxa de preenchimento de cada slot extra.
#
# Ao final apply() compacta os buracos ("Fix any gaps, the client cannot handle
# this"), entao Chance que falhou nao deixa espaco vazio no meio.
#
# ---------------------------------------------------------------------------
# AJUSTES DE 03/set/2026
# ---------------------------------------------------------------------------
# 1. DANO CONTRA ELEMENTO SAIU DO T3.
#    DAMAGE_PROPERTY_SAINT/DARKNESS/UNDEAD_TARGET foram removidos do sorteio
#    extra. Equipamento nao da mais bonus de dano contra um tipo - so
#    resistencia, SP e o resto. As opcoes seguem existindo no
#    item_randomopt_db.yml DE PROPOSITO: item que JA rolou uma delas
#    continua funcionando. Apagar o Id de la faria o bonus aparecer na tela
#    do cliente e nao fazer nada no servidor - status.cpp:4167 procura o Id
#    em random_option_db e, se nao acha, pula em silencio.
#
# 2. RESISTENCIA ELEMENTAL PADRONIZADA EM 2..5%.
#    Antes: T2 tinha Neutro 1..3 e os elementos 2..5; T3 tinha Neutro 3..6 e
#    Sagrado/Sombrio/Morto-Vivo 3..8. Agora todos sao 2..5 nos dois tiers.
#    CONSEQUENCIA ACEITA: resistencia deixou de progredir entre T2 e T3. O
#    que separa os tiers agora e a CHANCE e as outras opcoes, nao o valor da
#    resistencia.
#
# 3. CHANCE DO SORTEIO EXTRA DO T3 PARA CIMA.
#    Percentuais e Vel.Atq: 2000/2500 -> 4000.  Demais: 5000 -> 7000.
#    Media da lista - que e, na pratica, a taxa de preenchimento de cada
#    indice extra: ~42% -> ~64%.
#
#    ISSO NAO MUDA QUANTOS ITENS SAO T3. O tier vem do nivel de uso do
#    equipamento (randopt_drop_t3_minlevel em conf/import/battle_conf.txt).
#    O que mudou e o quanto um item T3 vem cheio.
#
# NADA DISSO ALCANCA ITEM QUE JA EXISTE. Este arquivo so e lido no instante
# do sorteio (drop, caixa, randomoptgroup de script). O resultado fica
# gravado no item, nas colunas option_id0..4 do inventory - mudar a regra
# aqui nao reescreve item nenhum. So a Roleta de Bonus refaz.
# ---------------------------------------------------------------------------
###########################################################################

Header:
  Type: RANDOM_OPTION_GROUP
  Version: 1

Body:

