# Biolaboratorio 4 (lhz_dun04) - mobs portados do renewal SEM DROPS
#
# Os 14 monstros do Bio Lab 4 (Ids 2221-2234) so existem em db/re/mob_db.yml,
# que NAO carrega neste build - as entradas de la sao Mode: Renewal. Por isso
# a copia.
#
# O QUE FOI TIRADO: os blocos Drops e MvpDrops, um por um. Era o pedido, e
# tambem evita um problema real - as tabelas de drop deles apontam para itens
# de renewal que este servidor pode nao ter. EXP e MvpExp ficaram.
#
# O QUE NAO FOI MEXIDO: elemento, raca, tamanho e a lista de habilidades.
# Nivel, HP, ataque, defesa e atributos FORAM rebalanceados - ver abaixo.
#
# ---------------------------------------------------------------------------
# REBALANCEADO EM 03/set/2026 - NAO SAO MAIS OS NUMEROS DO RENEWAL
# ---------------------------------------------------------------------------
# Como veio do renewal, a sala era INJOGAVEL. Nao "dificil": injogavel.
#
# Em pre-renewal a DEF do monstro e PERCENTUAL - DEF 100 = imune a dano
# fisico - e o teto e DEFTYPE_MAX = CHAR_MAX = 127 (src/config/const.hpp:55).
# O Paladino Randel vinha com DEF 667. O boot cortava para 127 e o bicho
# ficava invulneravel; a Professora Celia, com MDEF 543, ficava imune a magia
# tambem. Ate o Chen, com DEF 125 sem nem ser capado, ja passava o Lorde do
# Inferno (77), o MVP mais duro que este servidor tinha.
#
# A REGUA FOI O lhz_dun03, o andar de baixo, um degrau acima dele:
#
#                       lhz_dun03 (existente)      Bio Lab 4 (agora)
#   normais   nivel     82-92                      95
#             HP        47k - 88k                  100k - 190k
#             ATQ       497 - 2530                 1400 - 2900
#             DEF       10 - 63                    20 - 68
#             MDEF      10 - 74                    12 - 85
#   MVP       nivel     99                         99
#             HP        182k - 347k                450k - 750k
#             ATQ       1688 - 5289                4200 - 7000
#             DEF       10 - 72                    55 - 90
#             MDEF      35 - 88                    40 - 95
#
# COMO, e nao so QUANTO: cada stat foi remapeado LINEARMENTE da faixa do
# renewal para a faixa alvo. Isso preserva a ORDEM entre os mobs - o Randel
# continua o mais tanque, a Celia continua a parede magica (MDEF 85, a maior
# da sala), o Stalker continua o de maior ATQ. Nada foi digitado no olho.
# Atributos primarios levaram fator unico: 0,70 nos normais, 0,60 nos MVP.
#
# EXP DOS MVP: o renewal nao define exp nenhuma para 2228-2234 - matar dava
# ZERO. Recebeu 24000/14000, que e 1,3x o dos MVP do lhz_dun03 (18000/10000).
#
# HABILIDADES: estavam so em db/re/mob_skill_db.txt, que este build nao le.
# As 372 linhas foram para db/import/mob_skill_db.txt - sem elas os 14 mobs
# entravam mudos. O Asura do Chen foi de 10s para 3,5s de intervalo la.
#
# PARA REAJUSTAR: as faixas alvo estao no topo do script que fez isto. Mexer
# num numero solto aqui quebra a proporcao com o resto da sala.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
#
# Spawns em npc/custom/lhz_dun04.txt.

