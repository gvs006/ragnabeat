version: '3.8'
services:
  db:
    image: mariadb:10.5
    container_name: ragnabeat_db
    environment:
      MYSQL_ROOT_PASSWORD: ragnarok
      MYSQL_USER: ragnarok
      MYSQL_PASSWORD: ragnarok
      MYSQL_DATABASE: ragnarok
    volumes:
      - ragnabeat_data:/var/lib/mysql
      # O MariaDB criará o banco automaticamente na primeira vez usando seus arquivos locais
      - ./sql-files/main.sql:/docker-entrypoint-initdb.d/1-main.sql
      - ./sql-files/logs.sql:/docker-entrypoint-initdb.d/2-logs.sql
      # Tabelas do web-server: guild_emblems, user_configs, char_configs,
      # merchant_configs. Ficaram de fora ate 10/ago/2026 - sem elas o cliente
      # nao consegue salvar emblema de guilda nem preferencia de UI (ex.: a aba
      # "Damage Info" do Alt+Q). Ver docs/auth-token.md.
      - ./sql-files/web.sql:/docker-entrypoint-initdb.d/3-web.sql
    ports:
      - "3307:3306"
    restart: always
    # Sem isto o rathena sobe antes do MariaDB aceitar conexao e os quatro
    # servidores morrem com "Can't connect to MySQL server on 'db:3306' (111)".
    # O depends_on sozinho so espera o container iniciar, nao o banco ficar
    # pronto - e na primeira subida o MariaDB ainda carrega os .sql do initdb.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rathena:
    build: .
    container_name: ragnabeat_server
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/server
    ports:
      - "6900:6900"
      - "6121:6121"
      - "5121:5121"
      # O cliente 2025-04-16 conecta no login pela 6951 (porta derivada em codigo,
      # nao vem do clientinfo.xml). Encaminhamos para a 6900 do login-server em vez
      # de mexer na config do rAthena.
      - "6951:6900"
      # web-server: o cliente 2025 monta a URL do web-server a partir do endereco
      # do servidor mais a porta 8888, fixa em codigo - nao ha campo para ela no
      # clientinfo.xml. Ele chama /charconfig/save, /userconfig/save e
      # /emblem/upload por ali.
      # Ate 10/ago/2026 publicavamos na 8889 porque a 8888 do host estava com o
      # OpenTelemetry Collector; o coletor foi movido para a 8890 (metricas
      # internas dele) e a 8888 voltou a ser nossa. Ver docs/auth-token.md.
      - "8888:8888"
    restart: always
    command: /bin/bash -c "./login-server & ./char-server & ./map-server & ./web-server & wait"

volumes:
  ragnabeat_data:
